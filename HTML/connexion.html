    <!-- css page de connexion -->


    <div id="sec_compte">
        <div class="panel_branding">
            <div class="branding_logo">
                <div class="branding_logo_icon">🏢</div>
                <div class="branding_logo_text">
                    <strong>Monestié</strong>
                    <span>Réservations</span>
                </div>
            </div>
            <div class="branding_titre">Gérez les salles de vos associations en toute simplicité</div>
            <div class="branding_sous_titre">Réservations, planning de ménage, messagerie et exports.</div>
        </div>

        <div class="panel_form">
            <form id="form_login">
                <div class="form_titre">Connexion</div>
                <div class="form_sous_titre">Accédez à votre espace de gestion</div>

                <label class="champ_label">Adresse email</label>
                <div class="champ_wrapper">
                    <input type="email" class="input_login" placeholder="marie.dupont@mairie-monestie.fr">
                </div>

                <label class="champ_label">Mot de passe</label>
                <div class="champ_wrapper">
                    <input type="password" class="input_login" placeholder="••••••••">
                </div>

                

                <button type="submit" class="btn_compte">Se connecter</button>
            </form>
        </div>
    </div>
